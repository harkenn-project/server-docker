{% extends "base.html" %}
{% block title %}Set up{% endblock %}
{% block content %}
<form class="card login" method="post" action="/admin/setup">
  <h1>Welcome to Harkenn</h1>
  <p class="hint">Choose the admin password. You can change it later from the Password page.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <label>Password <input type="password" name="password" minlength="10" autofocus required autocomplete="new-password"></label>
  <label>Confirm password <input type="password" name="confirm" minlength="10" required autocomplete="new-password"></label>
  <button type="submit">Save and log in</button>
</form>
{% endblock %}
