<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Harkenn{% endblock %} · Harkenn</title>
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body data-page="{% block page %}{% endblock %}" {% block body_attrs %}{% endblock %}>
  <header class="topbar">
    <a class="brand" href="/admin"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="2.4"/><path d="M10 7.5a6.5 6.5 0 0 1 0 9M14 4.5a10.5 10.5 0 0 1 0 15"/></svg> Harkenn</a>
    {% if admin %}
    <nav>
      <a href="/admin">Speakers</a>
      <a href="/admin/characters">Characters</a>
      <a href="/admin/sounds">Sounds</a>
      <a href="/admin/voice">Voice</a>
      <a href="/admin/defaults">Defaults</a>
      <a href="/admin/firmware">Firmware</a>
      <a href="/admin/agents">Agents</a>
      <a href="/admin/server">Server</a>
      <a href="/admin/password">Password</a>
      <form method="post" action="/admin/logout"><button class="link">Log out</button></form>
    </nav>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="footer">
    <img class="pip" src="/static/pip-64.png" alt="" width="20" height="20"> Harkenn, by Master Magic and Pip (AI) ·
    <a href="https://github.com/sponsors/harkenn-project" target="_blank" rel="noopener">☕ Support Harkenn</a>
    (half goes to the <a href="https://github.com/harkenn-project/server-docker/blob/main/SUPPORT.md" target="_blank" rel="noopener">projects it's built on</a>) ·
    <a href="https://github.com/harkenn-project/server-docker/blob/main/THANKS.md" target="_blank" rel="noopener">Thank you</a>
  </footer>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/static/admin.js"></script>
</body>
</html>
