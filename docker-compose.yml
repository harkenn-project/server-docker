# Harkenn on one machine: `docker compose up -d`, then open http://<this machine>:8000/admin and set a password.
# Speech recognition (Whisper) and speech (Piper) run inside the container; their models download the first time
# they're needed and are kept in the harkenn-data volume.
#
# Speakers find the server by themselves: it announces itself on the network as harkenn.local (mDNS), which is why it
# shares the host's network. If speakers are on another network (VLAN), add a DNS record "harkenn" pointing at this
# machine in your router, or enter the address on the speaker's own page (its hotspot, at 192.168.4.1) under "Settings".
services:
  harkenn:
    image: ghcr.io/harkenn-project/server-docker:latest
    restart: unless-stopped
    network_mode: host  # port 8000, plus mDNS
    environment:
      HARKENN_PUBLIC_URL: "http://harkenn.local:8000"  # how speakers reach this server
      TZ: "America/Edmonton"
    volumes:
      - harkenn-data:/data

volumes:
  harkenn-data:
